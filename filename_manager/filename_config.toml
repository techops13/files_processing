[normalization]
convert_year_parentheses = true
preserve_manual_brackets = true
missing_publisher = "Unknown"
review_missing_author = true
convert_plus_separators = true

[casing]
enabled = true
review_unknown_proper_names = true
preserve_curated = true
acronyms = ["AI", "ML", "LLM", "NLP", "API", "SQL", "GPU", "CPU", "HTML", "JSON", "AWS"]
special_terms = ["Python", "ChatGPT", "PyTorch", "TensorFlow", "NumPy", "macOS", "iPhone", "GitHub", "Streamlit", "JavaScript", "scikit-learn"]

[duplicates]
show_limit = 10

[sanitization]
enabled = true
replace_plus = true
replace_dense_hyphens = true
dense_hyphen_min_tokens = 4
# Dense hyphens are proposals requiring review and never auto-applied.

[archive_protection]
# Mandatory safety rule: archive files, including multipart volumes, are always skipped.
skip_all_archive_files = true
